version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: dochub-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dochub
    ports:
      - "5432:5432"
    volumes:
      - dochub-pgdata:/var/lib/postgresql/data

volumes:
  dochub-pgdata:
[project]
name = "dochub-ai-service"
version = "0.1.0"
description = "DocHub AI microservice (FastAPI)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.55.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
